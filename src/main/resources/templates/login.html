<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Gestion des formations</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="max-width: 440px;">
        <div style="text-align: center; margin-bottom: 18px;">
            <span class="badge">Authentification</span>
            <h2>Connexion</h2>
            <p class="subtitle">Accédez à l'application de gestion des formations</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            Nom d'utilisateur ou mot de passe incorrect.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Vous avez bien été déconnecté.
        </div>

        <div class="form-card" style="margin-bottom: 0;">
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur :</label>
                    <input type="text" id="username" name="username" placeholder="Ex : admin ou imen" required autofocus />
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn-submit" style="width: 100%;">Se connecter</button>
            </form>
        </div>
    </div>
</body>
</html>

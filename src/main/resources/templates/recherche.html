<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rechercher une formation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container container-wide">
        <div class="topbar">
            <div>
                <span class="badge">Exploration</span>
                <h2>Rechercher une formation</h2>
            </div>
            <div class="actions-inline">
                <a class="btn-link" th:href="@{/}">Accueil</a>
            </div>
        </div>

        <div class="form-card">
            <form th:action="@{/recherche}" method="get">
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label>Thème :</label>
                        <select name="themeId">
                            <option value="">-- Tous les thèmes --</option>
                            <option th:each="t : ${themes}"
                                    th:value="${t.id}"
                                    th:text="${t.theme}"
                                    th:selected="${selectedThemeId != null and selectedThemeId == t.id}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label>Du :</label>
                        <input type="date" name="dateDebut"
                               th:value="${dateDebut != null ? #dates.format(dateDebut, 'yyyy-MM-dd') : ''}" />
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label>Au :</label>
                        <input type="date" name="dateFin"
                               th:value="${dateFin != null ? #dates.format(dateFin, 'yyyy-MM-dd') : ''}" />
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn-submit">Rechercher</button>
                    </div>
                </div>
            </form>
        </div>

        <h3>Résultats</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Thème</th>
                        <th>Date début</th>
                        <th>Date fin</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${resultats}">
                        <td th:text="${r.description}"></td>
                        <td th:text="${r.themeFormation != null ? r.themeFormation.theme : ''}"></td>
                        <td th:text="${r.datedebut != null ? #dates.format(r.datedebut, 'dd/MM/yyyy') : ''}"></td>
                        <td th:text="${r.datefin != null ? #dates.format(r.datefin, 'dd/MM/yyyy') : ''}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
